name: 0.2.0 Build Check

on:
  push:
    branches:
      - 0.2.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build

      - name: Smoke tests
        env:
          CI: "true"
        run: npm test -- --watchAll=false
